# Draft F-Droid recipe — dependency blocker resolved, submit as an MR.
#
# The former NonFreeDep blocker is gone: face detection now runs on MediaPipe
# BlazeFace short-range (Apache-2.0) through LiteRT, and
# com.google.mlkit:face-detection plus play-services-tasks are no longer
# dependencies (see docs/STORE.md and FaceBoxes.kt).
#
# Remaining items to settle with an fdroiddata maintainer before opening the
# MR:
#   * Which Flutter SDK the build server provides, and whether `flutter
#     precache --android` can run inside the build. Pinning a Flutter release
#     through `srclibs` is the usual answer for Flutter apps.
#   * tag `v1.0.0` below must exist on the repository before the MR.
#   * Whether the 84 MB assets/models/nsfw_int8.tflite may stay in the source
#     tarball. It must: the app has no INTERNET permission, so it can never
#     download a model at runtime.
Categories:
  - Security
License: AGPL-3.0-or-later
AuthorName: Basirah contributors
WebSite: https://github.com/obsidian-voxel/basirah
SourceCode: https://github.com/obsidian-voxel/basirah
IssueTracker: https://github.com/obsidian-voxel/basirah/issues

AutoName: Basirah

RepoType: git
Repo: https://github.com/obsidian-voxel/basirah

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.0
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm,android-arm64
    ndk: r27

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
