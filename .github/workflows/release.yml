name: release

# Analyzes and tests every push. Builds and signs a release AAB + APK on a tag,
# and attaches both to a GitHub Release. Signing reads repository secrets, so a
# fork or a clone without them gets the checks and no artefact — never an
# unsigned file pretending to be a release.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (Dart)
        run: flutter test

      - name: Test (Kotlin unit tests)
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest --no-daemon

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fail early when the signing secrets are absent
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to build an unsigned release"
            exit 1
          fi

      - name: Restore keystore and key.properties
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > android/app/haram-blur-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/haram-blur-release.jks
          EOF

      - name: Build AAB and APK
        run: |
          flutter pub get
          flutter build appbundle --release --target-platform android-arm,android-arm64
          flutter build apk       --release --target-platform android-arm,android-arm64

      - name: Verify the APK is signed with the release key
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools"
          APKSIGNER="$(find "$BUILD_TOOLS" -name apksigner | sort -r | head -1)"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | head -20

      - name: Attach artefacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: true
          generate_release_notes: true
